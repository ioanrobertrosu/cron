# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: 

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"

    - name: Check code malformations
      id: check_malformations
      run: go vet ./...

    - name: Output Success
      if: ${{steps.check_malformations.outcome == 'success'}}
      run: echo "✅"

    - name: Output Failure
      if: ${{always() && steps.check_malformations.outcome == 'failure'}}
      run: echo "❌"

  test:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Create coverage folder
        run: mkdir -p coverage

      - name: Execute Tests
        run: go test -race -coverprofile=coverage/cover.out

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: test
          path: coverage/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Project Build
        id: build
        run: go build ./...

      - name: Output Success
        if: ${{steps.build.outcome == 'success'}}
        run: echo "✅"

      - name: Output Failure
        if: ${{always() && steps.build.outcome == 'failure'}}
        run: echo "❌"

        
            
        
